<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粤师聘 · 广东省教师招聘公告聚合平台</title>
  <link rel="stylesheet" href="styles.css?v=20261109c">
</head>
<body>
<div class="app">
  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="logo">粤</div>
      <span>粤师聘</span>
    </div>
    <div class="nav-right">
      <a href="index.html" class="nav-link active">公告库</a>
      <span class="nav-note">广东全省 · 21 个地市</span>
    </div>
  </nav>

  <div class="container">
    <!-- 筛选区 -->
    <div class="filter-card">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索公告、学校或岗位关键词...">
        <button class="search-btn" onclick="doSearch()">搜索</button>
      </div>

      <div class="quick-filters">
        <button class="quick-btn active" data-filter="all" onclick="setQuickFilter(this)">全部公告</button>
        <button class="quick-btn" data-filter="formal" onclick="setQuickFilter(this)">正式编</button>
        <button class="quick-btn" data-filter="private" onclick="setQuickFilter(this)">民办</button>
        <button class="quick-btn" data-filter="soon" onclick="setQuickFilter(this)">即将截止</button>
        <button class="quick-btn" data-filter="hideExpired" onclick="setQuickFilter(this)">隐藏已截止</button>
      </div>

      <div class="filter-row">
        <span class="filter-label">城市</span>
        <div class="filter-tags" id="cityTags"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">学段</span>
        <div class="filter-tags" id="stageTags"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">编制性质</span>
        <div class="filter-tags" id="estTags"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">学历要求</span>
        <div class="filter-tags" id="eduTags"></div>
      </div>
    </div>

    <!-- 统计栏 -->
    <div class="stats-bar">
      <span>共找到 <strong id="totalCount">0</strong> 条招聘公告 · 广东省</span>
      <div class="stats-actions">
        <span class="stats-updated">数据更新：<span id="updatedAt">--</span></span>
        <button class="export-btn" onclick="exportJobs()">⤓ 下载岗位文档</button>
      </div>
    </div>

    <!-- 公告列表 -->
    <div class="table-card">
      <div class="table-header">
        <span>公告标题</span>
        <span>招聘单位</span>
        <span>学段</span>
        <span>编制</span>
        <span>报名截止</span>
        <span>人数</span>
        <span></span>
      </div>
      <div id="jobList"></div>
    </div>

    <!-- 分页 -->
    <div class="pagination">
      <div class="page-info" id="pageInfo">第 1 页</div>
      <div class="page-btns" id="pageBtns"></div>
    </div>
  </div>
</div>

<!-- 右侧收藏栏 -->
<button class="fav-tab" id="favTab" onclick="toggleFavPanel()">收藏<span class="fav-count" id="favCount">0</span></button>
<div class="fav-panel" id="favPanel">
  <div class="fav-panel-header">
    <span>我的收藏</span>
    <button class="fav-panel-close" onclick="toggleFavPanel()">✕</button>
  </div>
  <div class="fav-panel-list" id="favList"></div>
</div>

<script src="mock.js?v=20261109c"></script>
<script src="data.js?v=20261109c"></script>
<script src="api.js?v=20261109c"></script>
<script>
  // 当前筛选状态
  const state = {
    keyword: "",
    city: "全部",
    stage: "全部",
    establishment: "全部",
    education: "全部",
    onlyFormal: false,
    onlySoon: false,
    onlyPrivate: false,
    hideExpired: false,
    page: 1,
    pageSize: 10
  };

  let allJobs = [];

  // ===== 已读 & 收藏（存浏览器本地，关掉网页也记得）=====
  const store = {
    get(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    set(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }
  };

  const viewedIds = new Set(JSON.parse(store.get('ysp_viewed') || '[]'));
  let favIds = JSON.parse(store.get('ysp_favs') || '[]');

  function markViewed(id) {
    viewedIds.add(id);
    store.set('ysp_viewed', JSON.stringify([...viewedIds]));
  }
  function isFav(id) { return favIds.includes(id); }
  function toggleFav(id, event) {
    event.stopPropagation();
    if (isFav(id)) {
      favIds = favIds.filter(x => x !== id);
    } else {
      favIds.unshift(id);
    }
    store.set('ysp_favs', JSON.stringify(favIds));
    loadJobs();
    renderFavPanel();
  }

  // 初始化筛选标签
  function initTags() {
    renderTags("cityTags", FILTER_OPTIONS.city, "city");
    renderTags("stageTags", FILTER_OPTIONS.stage, "stage");
    renderTags("estTags", FILTER_OPTIONS.establishment, "establishment");
    renderTags("eduTags", FILTER_OPTIONS.education, "education");
  }

  function renderTags(containerId, options, key) {
    const container = document.getElementById(containerId);
    container.innerHTML = options.map(opt =>
      `<span class="filter-tag ${state[key] === opt ? 'active' : ''}" onclick="setFilter('${key}','${opt}')">${opt}</span>`
    ).join('');
  }

  function setFilter(key, value) {
    state[key] = value;
    state.page = 1;
    initTags();
    loadJobs();
  }

  function setQuickFilter(btn) {
    const f = btn.dataset.filter;
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));

    if (f === 'all') {
      state.onlyFormal = false;
      state.onlySoon = false;
      state.onlyPrivate = false;
      state.hideExpired = false;
    } else if (f === 'formal') {
      state.onlyFormal = !state.onlyFormal;
      state.onlySoon = false;
      state.onlyPrivate = false;
      state.hideExpired = false;
    } else if (f === 'soon') {
      state.onlySoon = !state.onlySoon;
      state.onlyFormal = false;
      state.onlyPrivate = false;
      state.hideExpired = false;
    } else if (f === 'private') {
      state.onlyPrivate = !state.onlyPrivate;
      state.onlyFormal = false;
      state.onlySoon = false;
      state.hideExpired = false;
    } else if (f === 'hideExpired') {
      state.hideExpired = !state.hideExpired;
      state.onlyFormal = false;
      state.onlySoon = false;
      state.onlyPrivate = false;
    }

    if (state.onlyFormal || state.onlySoon || state.onlyPrivate || state.hideExpired) {
      btn.classList.add('active');
    } else {
      document.querySelector('.quick-btn[data-filter="all"]').classList.add('active');
    }
    state.page = 1;
    loadJobs();
  }

  function doSearch() {
    state.keyword = document.getElementById('searchInput').value.trim();
    state.page = 1;
    loadJobs();
  }

  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
  });

  // 加载公告列表
  async function loadJobs() {
    const { list, total } = await API.getJobs(state);
    allJobs = list;
    document.getElementById('totalCount').textContent = total;

    const start = (state.page - 1) * state.pageSize;
    const pageData = list.slice(start, start + state.pageSize);

    renderList(pageData);
    renderPagination(total);
  }

  function getDeadlineClass(deadline) {
    if (!deadline) return { cls: "deadline-ok", text: "以官方原文为准" };
    const today = new Date();
    const d = new Date(deadline);
    const days = (d - today) / (1000 * 60 * 60 * 24);
    if (days < 0) return { cls: "deadline-over", text: "已截止" };
    if (days <= 7) return { cls: "deadline-soon", text: `${deadline}（${Math.ceil(days)}天）` };
    return { cls: "deadline-ok", text: deadline };
  }

  function getEstBadge(est) {
    if (est.includes("正式编")) return `<span class="badge badge-formal">${est}</span>`;
    if (est.includes("事业编")) return `<span class="badge badge-formal">${est}</span>`;
    if (est.includes("长聘")) return `<span class="badge badge-talent">${est}</span>`;
    return `<span class="badge badge-contract">${est}</span>`;
  }

  // 一眼区分：正式编 / 即将截止 / 民办
  function getJobTags(j) {
    const tags = [];
    if (isFormalJob(j)) tags.push('<span class="tag tag-formal">正式编</span>');
    if (isSoonJob(j)) tags.push('<span class="tag tag-soon">即将截止</span>');
    if (isPrivateJob(j)) tags.push('<span class="tag tag-private">民办</span>');
    return tags.length ? `<div class="job-tags">${tags.join('')}</div>` : '';
  }

  function renderList(jobs) {
    const container = document.getElementById('jobList');
    if (jobs.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>暂无符合条件的招聘公告</div><div class="empty-tip">试试换个城市，或点「全部公告」重置筛选</div></div>';
      return;
    }
    container.innerHTML = jobs.map(j => {
      const dl = getDeadlineClass(j.deadline);
      return `
        <div class="table-row ${viewedIds.has(j.id) ? 'viewed' : ''}" onclick="goDetail(${j.id})">
          <div class="c-title">
            <div class="job-title">${j.title}</div>
            ${getJobTags(j)}
            <div class="job-meta">${j.city} · ${j.source} · 录入 ${j.recordedAt}</div>
          </div>
          <div class="c-school">${j.school}</div>
          <div class="c-stage">${j.stage}</div>
          <div class="c-est">${getEstBadge(j.establishment)}</div>
          <div class="c-deadline ${dl.cls}">${dl.text}</div>
          <div class="c-head">${j.headcount ? `<strong>${j.headcount}</strong> 人` : '<span style="color:var(--gray-400);">详见原文</span>'}</div>
          <div class="c-fav">
            <button class="fav-star ${isFav(j.id) ? 'active' : ''}" onclick="toggleFav(${j.id}, event)" title="${isFav(j.id) ? '取消收藏' : '收藏'}">${isFav(j.id) ? '★' : '☆'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderPagination(total) {
    const totalPages = Math.ceil(total / state.pageSize) || 1;
    document.getElementById('pageInfo').textContent = `第 ${state.page} / ${totalPages} 页，共 ${total} 条`;

    let btns = `<button class="page-btn" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - state.page) <= 1) {
        btns += `<button class="page-btn ${i === state.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - state.page) === 2) {
        btns += `<span style="padding:0 4px;color:var(--gray-400);">...</span>`;
      }
    }
    btns += `<button class="page-btn" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>下一页</button>`;
    document.getElementById('pageBtns').innerHTML = btns;
  }

  function goPage(p) {
    state.page = p;
    loadJobs();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goDetail(id) {
    markViewed(id);
    window.location.href = `detail.html?id=${id}`;
  }

  // ===== 右侧收藏面板 =====
  function toggleFavPanel() {
    document.getElementById('favPanel').classList.toggle('open');
  }

  async function renderFavPanel() {
    document.getElementById('favCount').textContent = favIds.length;
    const { list } = await API.getJobs({});
    const favJobs = favIds.map(id => list.find(j => j.id === id)).filter(Boolean);
    const box = document.getElementById('favList');
    if (favJobs.length === 0) {
      box.innerHTML = '<div class="fav-empty">还没有收藏公告<br>点击列表右侧的 ☆ 即可收藏</div>';
      return;
    }
    box.innerHTML = favJobs.map(j => {
      const dl = getDeadlineClass(j.deadline);
      return `
        <div class="fav-item" onclick="goDetail(${j.id})">
          <div class="fav-item-title">${j.title}</div>
          <div class="fav-item-meta">
            <span class="${dl.cls}">截止 ${dl.text}</span>
            <button class="fav-item-remove" onclick="toggleFav(${j.id}, event)" title="移除收藏">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 导出当前筛选结果（Excel / WPS 可直接打开的表格）
  function exportJobs() {
    const jobs = allJobs;
    if (!jobs.length) {
      alert('当前没有公告可以导出，请先调整筛选条件');
      return;
    }
    const head = ['公告标题', '城市', '招聘单位', '学段', '编制性质', '招聘人数', '学历要求', '报名截止', '录入日期', '原文链接'];
    const rows = jobs.map(j => [
      j.title,
      j.city,
      j.school,
      j.stage,
      j.establishment,
      j.headcount ? j.headcount + ' 人' : '详见原文',
      j.education,
      j.deadline || '以官方原文为准',
      j.recordedAt,
      j.sourceUrl
    ]);
    const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const csv = [head, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '粤师聘-岗位列表-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // 显示数据更新日期（由爬虫写进 data.js，取不到就用最新一条公告的日期）
  function showUpdatedAt() {
    let t = window.DATA_UPDATED || '';
    if (!t && MOCK_JOBS.length) {
      t = MOCK_JOBS.map(j => j.recordedAt).sort().pop();
    }
    document.getElementById('updatedAt').textContent = t || '--';
  }

  // 初始化
  initTags();
  loadJobs();
  renderFavPanel();
  showUpdatedAt();
</script>
</body>
</html>
